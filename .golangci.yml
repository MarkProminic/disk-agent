version: '2'

run:
  timeout: 5m

linters:
  # Standard group: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    gosec:
      excludes:
        - G204
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: no console printing — use log/slog
        - pattern: ^print(ln)?$
          msg: no console printing — use log/slog
  exclusions:
    # std-error-handling only; deliberately NOT common-false-positives so
    # every finding stays visible. Findings are fixed in code — never
    # suppressed inline; a rule-level exclusion (see gosec above) requires an
    # explicit recorded decision.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MarkProminic/disk-agent
