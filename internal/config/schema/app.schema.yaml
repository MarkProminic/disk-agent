$schema: https://json-schema.org/draft/2020-12/schema
title: Application
schemaVersion: 1
sections:
  application:
    title: Application
    order: 1
  logging:
    title: Logging
    order: 2
  collection:
    title: Collection
    order: 3
properties:
  schemaVersion:
    type: integer
    readOnly: true
    default: 1
    title: Schema version
  server:
    type: object
    section: application
    subsection: server
    title: Server
    order: 1
    properties:
      bind_address:
        type: string
        default: 0.0.0.0
        title: Bind address
        description: Address the web server binds to
        order: 1
        requiresRestart: true
        restartReason: the listeners are bound at boot
      port:
        type: integer
        minimum: 1
        maximum: 65535
        default: 9430
        title: HTTP port
        order: 2
        requiresRestart: true
        restartReason: the HTTP listener is bound at boot
      https_port:
        type: integer
        minimum: 1
        maximum: 65535
        default: 9431
        title: HTTPS port
        description: Bound only when ssl.enabled
        order: 3
        requiresRestart: true
        restartReason: the HTTPS listener is bound at boot
  ssl:
    type: object
    section: application
    subsection: ssl
    title: SSL
    order: 2
    properties:
      enabled:
        type: boolean
        default: true
        title: HTTPS
        description: Serve HTTPS on server.https_port; certificate problems leave the agent HTTP-only, never down
        order: 1
        requiresRestart: true
        restartReason: the HTTPS listener is bound at boot
      force_secure:
        type: boolean
        default: true
        title: Redirect HTTP to HTTPS
        description: With SSL enabled the plain port serves only redirects; false keeps it serving the full app for clients that cannot follow redirects
        order: 2
        requiresRestart: true
        restartReason: the plain listener's handler is chosen at boot
      generate_ssl:
        type: boolean
        default: true
        title: Generate certificates
        description: Generate the server certificate when none exists, signed by the CA below, itself generated when absent
        order: 3
        requiresRestart: true
        restartReason: certificates are generated and read at boot
      key_path:
        type: string
        default: ''
        title: Server key path
        description: Empty = ssl/server.key beside the configuration files, written here at boot
        order: 4
        requiresRestart: true
        restartReason: the key is read when the HTTPS listener is bound at boot
      cert_path:
        type: string
        default: ''
        title: Server certificate path
        description: Empty = ssl/server.crt beside the configuration files, written here at boot
        order: 5
        requiresRestart: true
        restartReason: the certificate is read when the HTTPS listener is bound at boot
      ca_cert_path:
        type: string
        default: ''
        title: CA certificate path
        description: The CA that signs the generated server certificate; empty = ssl/ca.crt beside the configuration files, written here at boot
        order: 6
        requiresRestart: true
        restartReason: the CA is read at boot
      ca_key_path:
        type: string
        default: ''
        title: CA key path
        description: Empty = ssl/ca.key beside the configuration files, written here at boot
        order: 7
        requiresRestart: true
        restartReason: the CA is read at boot
  cors:
    type: object
    section: application
    subsection: cors
    title: CORS
    order: 3
    properties:
      allow_all:
        type: boolean
        default: true
        title: Allow every origin
        description: The API key, not the browser origin, is the access boundary; false falls back to the whitelist
        order: 1
        requiresRestart: true
        restartReason: the CORS middleware is built at boot
      whitelist:
        type: array
        items:
          type: string
        default: []
        title: Allowed origins
        description: scheme://host:port entries used when allow_all is false
        order: 2
        requiresRestart: true
        restartReason: the CORS middleware is built at boot
  logging:
    type: object
    section: logging
    subsection: logging
    title: Logging
    order: 1
    properties:
      level:
        type: string
        enum: [error, warn, info, debug]
        default: info
        title: Log level
        order: 1
        requiresRestart: true
        restartReason: the logger takes its level at boot
      console:
        type: boolean
        default: true
        title: Console output
        description: Also log human-readable output to the console
        order: 2
        requiresRestart: true
        restartReason: the console handler is attached at boot
      file:
        type: string
        default: ''
        title: Log file
        description: Empty = logs/agent.log beside the configuration files, written here at boot
        order: 3
        requiresRestart: true
        restartReason: the log file is opened at boot
      max_size_mb:
        type: integer
        minimum: 1
        default: 20
        title: Maximum size (MB)
        description: Log file size before rotation
        order: 4
        requiresRestart: true
        restartReason: the rotation is configured at boot
      max_backups:
        type: integer
        minimum: 0
        default: 5
        title: Rotated files kept
        order: 5
        requiresRestart: true
        restartReason: the rotation is configured at boot
      compression:
        type: boolean
        default: true
        title: Compress rotated files
        order: 6
        requiresRestart: true
        restartReason: the rotation is configured at boot
      categories:
        type: object
        subsection: loggingCategories
        title: Category levels
        description: Per-category levels overriding the global level; categories are app, api_requests, auth
        propertyNames:
          pattern: '^[a-z_]+$'
        additionalProperties:
          type: string
          enum: [error, warn, info, debug]
          requiresRestart: true
          restartReason: each category logger takes its level at boot
  collection:
    type: object
    section: collection
    subsection: collection
    title: Collection
    order: 1
    properties:
      smartctl_path:
        type: string
        default: smartctl
        title: smartctl path
        description: The smartctl binary; a bare name is looked up on PATH
        order: 1
      zpool_path:
        type: string
        default: zpool
        title: zpool path
        description: The zpool binary; a bare name is looked up on PATH
        order: 2
      privilege_command:
        type: string
        default: ''
        title: Privilege command
        description: Prepended to every smartctl and zpool call, sudo on Debian, pfexec on OmniOS; empty runs them as the service user
        order: 3
