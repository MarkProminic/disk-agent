$schema: https://json-schema.org/draft/2020-12/schema
title: Authentication
schemaVersion: 1
sections:
  authentication:
    title: Authentication
    order: 1
properties:
  schemaVersion:
    type: integer
    readOnly: true
    default: 1
    title: Schema version
  api_keys:
    type: object
    section: authentication
    subsection: apiKeys
    title: API keys
    order: 1
    properties:
      bootstrap_enabled:
        type: boolean
        default: true
        title: Bootstrap endpoint
        description: Allow POST /api/api-keys/bootstrap to create the first API key
        order: 1
      bootstrap_auto_disable:
        type: boolean
        default: true
        title: Lock after the first key
        order: 2
      bootstrap_require_claim_token:
        type: boolean
        default: true
        title: Require the setup token
        description: The token in setup.token beside the configuration files, printed to the startup log, proves host ownership
        order: 3
      hash_rounds:
        type: integer
        minimum: 4
        maximum: 20
        default: 12
        title: Hash rounds
        description: bcrypt cost of stored key hashes
        order: 4
      key_length:
        type: integer
        minimum: 16
        maximum: 256
        default: 64
        title: Key length
        description: Random bytes of key material after the da_ prefix
        order: 5
