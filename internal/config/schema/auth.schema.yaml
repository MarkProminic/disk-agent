$schema: https://json-schema.org/draft/2020-12/schema
title: Authentication
schemaVersion: 1
sections:
  authentication:
    title: Authentication
    order: 1
properties:
  schemaVersion:
    type: integer
    readOnly: true
    default: 1
    title: Schema version
  api_keys:
    type: object
    section: authentication
    subsection: apiKeys
    title: API keys
    order: 1
    properties:
      hash_rounds:
        type: integer
        minimum: 4
        maximum: 20
        default: 12
        title: Hash rounds
        description: bcrypt cost of stored key hashes
        order: 1
      key_length:
        type: integer
        minimum: 16
        maximum: 256
        default: 64
        title: Key length
        description: Random bytes of key material after the da_ prefix
        order: 2
